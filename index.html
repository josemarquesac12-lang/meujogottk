<!-- Linguagem: HTML, CSS e JavaScript -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo de Corrida</title>
    <style>
        body { 
            margin: 0; 
            background-color: #222; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: sans-serif;
            color:#fff;
        }
        canvas {
            background-color: #555;
            display: block;
            border: 3px solid #fff;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const car = {
    width: 50,
    height: 100,
    x: canvas.width/2 - 25,
    y: canvas.height - 120,
    dx: 0,
    speed: 5
};

let obstacles = [];
let obstacleSpeed = 3;
let score = 0;
let gameOver = false;

// Controle do carro
document.addEventListener('keydown', e => {
    if(e.key === "ArrowLeft") car.dx = -car.speed;
    if(e.key === "ArrowRight") car.dx = car.speed;
});
document.addEventListener('keyup', e => {
    if(e.key === "ArrowLeft" || e.key === "ArrowRight") car.dx = 0;
});

function update() {
    if(gameOver) return;

    car.x += car.dx;
    if(car.x < 0) car.x = 0;
    if(car.x + car.width > canvas.width) car.x = canvas.width - car.width;

    // Obstáculos
    if(Math.random() < 0.02) {
        const width = Math.random() * 100 + 30;
        obstacles.push({x: Math.random()*(canvas.width-width), y: -20, width, height: 20});
    }

    for(let obs of obstacles) {
        obs.y += obstacleSpeed;
        // Colisão
        if(car.x < obs.x + obs.width &&
           car.x + car.width > obs.x &&
           car.y < obs.y + obs.height &&
           car.y + car.height > obs.y) {
            gameOver = true;
        }
    }
    obstacles = obstacles.filter(obs => obs.y < canvas.height);
    score++;
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    
    // Carro
    ctx.fillStyle = "red";
    ctx.fillRect(car.x, car.y, car.width, car.height);
    
    // Obstáculos
    ctx.fillStyle = "yellow";
    for(let obs of obstacles) {
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
    }

    // Pontuação
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("Score: " + score, 10, 30);

    if(gameOver){
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", 80, canvas.height/2);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
